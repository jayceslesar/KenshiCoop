name: CI

# Game-free CI only. The full behaviour suite (scripts/regress.ps1) launches two
# real Kenshi clients and judges screenshots/logs, so it needs a licensed game on
# an interactive desktop and CANNOT run here - and a faked version would give false
# confidence. CI covers exactly what does NOT need the game: the protocol/hash/
# interp unit layer (prototest) and script linting. The behaviour suite stays a
# LOCAL gate (see docs/DEVELOPING.md).

on:
  push:
    branches: [release, main]
  pull_request:
  workflow_dispatch:

jobs:
  prototest:
    name: prototest (protocol/hash/interp unit layer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # prototest's TUs are game-free but include NetLink.h, which includes
      # <enet/enet.h>. The vendored copy is git-ignored, so fetch the pinned
      # version. No .lib is linked - headers are enough (see build_prototest_ci.cmd).
      - name: Fetch enet 1.3.18 headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.18 https://github.com/lsalzman/enet.git third_party/enet/enet
          if (-not (Test-Path third_party/enet/enet/include/enet/enet.h)) {
            throw "enet headers missing after clone"
          }

      - name: Build prototest (ambient MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          call scripts\build_prototest_ci.cmd

      - name: Run prototest
        shell: cmd
        run: dist\prototest.exe

  lint:
    name: PowerShell lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze scripts/
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          # Errors fail the build; warnings are surfaced but tolerated (the harness
          # scripts legitimately use Write-Host and positional args). Tighten later.
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($results.Count) error-level finding(s)."
            exit 1
          }
          Write-Host "No error-level findings."
